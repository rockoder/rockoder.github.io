# LLM Model Configuration for Beyond the Code Pipeline
# Edit this file to switch models without code changes.
#
# Both providers are local CLI tools, authenticated via subscription/login on
# this machine (no API keys, no per-token billing):
#   - claude_code: shells out to `claude -p ...` (personal Claude Code subscription)
#   - codex:       shells out to `codex exec ...` (free ChatGPT/Codex CLI login)
# There is deliberately no `fallback:` on any task — a failed CLI call should
# fail loudly rather than silently falling back to a paid API.

models:
  # Fast/cheap classification task — Codex, keeps Claude Code capacity for writing
  topic_extraction:
    provider: "codex"

  # Outline/draft/revision — Claude Code CLI, plays the "writer" role
  outline_generation:
    provider: "claude_code"
    model: "sonnet"

  # Critique steps — Codex CLI, plays the "reviewer" role (previously Gemini)
  outline_critique:
    provider: "codex"

  draft_writing:
    provider: "claude_code"
    model: "sonnet"

  draft_critique:
    provider: "codex"

  final_revision:
    provider: "claude_code"
    model: "sonnet"
